<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>svgnest-service worker page</title>
    <base href="../../SVGnest-master/SVGnest-master/" />
    <script src="util/pathsegpolyfill.js"></script>
    <script src="util/matrix.js"></script>
    <script src="util/domparser.js"></script>
    <script src="util/clipper.js"></script>
    <script src="util/parallel.js"></script>
    <script src="util/geometryutil.js"></script>
    <script src="util/placementworker.js"></script>
    <script src="svgparser.js"></script>
    <script src="svgnest.js"></script>
  </head>
  <body>
    <div id="stage" style="display: none"></div>
    <script>
      const colorFor = (name) => {
        const n = String(name || "").toLowerCase();
        if (n.includes("face")) return "#5b6ee1";
        if (n.includes("dos")) return "#ef6a8b";
        if (n.includes("rabat")) return "#ffaf5f";
        if (n.includes("poche")) return "#48e38f";
        return "#8e99f3";
      };

      function parseTransform(t) {
        const text = String(t || "");
        const tr = /translate\(([-\d.]+)[ ,]([-\d.]+)\)/.exec(text);
        const rr = /rotate\(([-\d.]+)\)/.exec(text);
        return {
          x: tr ? Number(tr[1]) : 0,
          y: tr ? Number(tr[2]) : 0,
          angle: rr ? Number(rr[1]) : 0,
        };
      }

      function isRotated(angleDeg) {
        const a = ((Number(angleDeg) % 360) + 360) % 360;
        return Math.abs(a - 90) < 1e-2 || Math.abs(a - 270) < 1e-2;
      }

      function buildInputSvg(req) {
        const parts = [];
        for (const p of req.pieces) {
          const qty = Math.max(1, Number(p.qty || 1));
          for (let i = 0; i < qty; i += 1) {
            parts.push({
              name: p.name,
              w: Number(p.width_mm),
              h: Number(p.height_mm),
              canRotate: p.can_rotate !== false,
              unitId: `${p.name}_${i}`,
            });
          }
        }
        let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${req.sheet_width_mm} ${req.sheet_height_mm}">`;
        out += `<rect id="bin-sheet" x="0" y="0" width="${req.sheet_width_mm}" height="${req.sheet_height_mm}" fill="none" stroke="#111"/>`;
        for (const p of parts) {
          out += `<rect id="part-${p.unitId}" data-part-name="${p.name}" data-unit-id="${p.unitId}" data-w="${p.w}" data-h="${p.h}" data-can-rotate="${p.canRotate ? "1" : "0"}" x="0" y="0" width="${p.w}" height="${p.h}" fill="none" stroke="#333"/>`;
        }
        out += "</svg>";
        return out;
      }

      function fallbackShelf(req) {
        const spacing = req.spacing_mm ?? 4;
        const units = [];
        for (const p of req.pieces) {
          for (let i = 0; i < p.qty; i += 1) units.push(p);
        }
        units.sort((a, b) => Math.max(b.width_mm, b.height_mm) - Math.max(a.width_mm, a.height_mm));
        const placements = [];
        let sheet = 0;
        let x = 0;
        let y = 0;
        let shelfH = 0;
        let used = 0;
        for (const p of units) {
          let w = p.width_mm;
          let h = p.height_mm;
          let rotated = false;
          if (p.can_rotate && x + w > req.sheet_width_mm && x + h <= req.sheet_width_mm && y + w <= req.sheet_height_mm) {
            [w, h] = [h, w];
            rotated = true;
          }
          if (x + w > req.sheet_width_mm) {
            x = 0;
            y += shelfH + spacing;
            shelfH = 0;
          }
          if (y + h > req.sheet_height_mm) {
            sheet += 1;
            x = 0;
            y = 0;
            shelfH = 0;
          }
          placements.push({ name: p.name, sheet_index: sheet, x_mm: +x.toFixed(3), y_mm: +y.toFixed(3), w_mm: +w.toFixed(3), h_mm: +h.toFixed(3), rotated, color: colorFor(p.name) });
          used += w * h;
          x += w + spacing;
          shelfH = Math.max(shelfH, h);
        }
        const sheetsUsed = sheet + 1;
        const total = req.sheet_width_mm * req.sheet_height_mm * sheetsUsed;
        const waste = Math.max(0, total - used);
        const wastePct = total > 0 ? (waste * 100) / total : 0;
        return {
          placements,
          sheets_used: sheetsUsed,
          sheet_width_mm: req.sheet_width_mm,
          sheet_height_mm: req.sheet_height_mm,
          used_area_mm2: +used.toFixed(3),
          total_area_mm2: +total.toFixed(3),
          waste_area_mm2: +waste.toFixed(3),
          waste_pct: +wastePct.toFixed(3),
          waste_percentage: +wastePct.toFixed(3),
        };
      }

      function extractQtResult(svglist, req) {
        const placements = [];
        let used = 0;
        for (let s = 0; s < svglist.length; s += 1) {
          const groups = Array.from(svglist[s].querySelectorAll("g"));
          for (const g of groups) {
            const el = g.querySelector("[data-part-name]");
            if (!el) continue;
            const tf = parseTransform(g.getAttribute("transform"));
            const name = el.getAttribute("data-part-name") || "piece";
            const w0 = Number(el.getAttribute("data-w") || 0);
            const h0 = Number(el.getAttribute("data-h") || 0);
            const rotated = isRotated(tf.angle);
            const w = rotated ? h0 : w0;
            const h = rotated ? w0 : h0;
            used += w0 * h0;
            placements.push({
              name,
              sheet_index: s,
              x_mm: +tf.x.toFixed(3),
              y_mm: +tf.y.toFixed(3),
              w_mm: +w.toFixed(3),
              h_mm: +h.toFixed(3),
              rotated,
              color: colorFor(name),
            });
          }
        }
        const sheetsUsed = Math.max(1, svglist.length);
        const total = req.sheet_width_mm * req.sheet_height_mm * sheetsUsed;
        const waste = Math.max(0, total - used);
        const wastePct = total > 0 ? (waste * 100) / total : 0;
        return {
          placements,
          sheets_used: sheetsUsed,
          sheet_width_mm: req.sheet_width_mm,
          sheet_height_mm: req.sheet_height_mm,
          used_area_mm2: +used.toFixed(3),
          total_area_mm2: +total.toFixed(3),
          waste_area_mm2: +waste.toFixed(3),
          waste_pct: +wastePct.toFixed(3),
          waste_percentage: +wastePct.toFixed(3),
        };
      }

      window.computeNesting = async (requestPayload, timeoutMs) => {
        if (!window.SvgNest) {
          throw new Error("SvgNest non charge dans worker-page");
        }
        const req = requestPayload;
        const cfg = req.config || {};
        const timeout = Number(timeoutMs || cfg.timeout_ms || 15000);

        try {
          const input = buildInputSvg(req);
          const svg = window.SvgNest.parsesvg(input);
          const stage = document.getElementById("stage");
          stage.innerHTML = "";
          stage.appendChild(svg);
          const bin = svg.querySelector("#bin-sheet");
          if (!bin) throw new Error("Bin non trouve");
          window.SvgNest.setbin(bin);
          window.SvgNest.config({
            spacing: req.spacing_mm ?? 4,
            curveTolerance: 0.3,
            rotations: cfg.rotations ?? 4,
            populationSize: cfg.populationSize ?? 10,
            mutationRate: cfg.mutationRate ?? 10,
            useHoles: !!cfg.useHoles,
            exploreConcave: !!cfg.exploreConcave,
          });

          const result = await new Promise((resolve, reject) => {
            let done = false;
            let best = null;
            const finalize = (value) => {
              if (done) return;
              done = true;
              try { window.SvgNest.stop(); } catch (_) {}
              resolve(value);
            };
            const timer = setTimeout(() => {
              if (best) finalize(best);
              else reject(new Error("Timeout SVGnest sans placement"));
            }, timeout);
            const onProgress = () => {};
            const onDisplay = (svglist) => {
              if (!svglist || !svglist.length) return;
              best = extractQtResult(svglist, req);
            };
            try {
              window.SvgNest.start(onProgress, onDisplay);
            } catch (e) {
              clearTimeout(timer);
              reject(e);
              return;
            }
            setTimeout(() => {
              clearTimeout(timer);
              if (best) finalize(best);
              else reject(new Error("Aucun placement genere"));
            }, Math.max(1200, Math.min(timeout, 4000)));
          });
          return result;
        } catch (_e) {
          return fallbackShelf(req);
        }
      };
    </script>
  </body>
</html>
