<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Fashion Oracle</title>
  <style>
    body { font-family: Segoe UI, Arial; background:#0f1116; color:#f2f2f2; max-width:860px; margin:40px auto; }
    input, button { padding:10px; border-radius:8px; border:none; }
    button { background:#8d5524; color:white; font-weight:700; }
    pre { background:#1b1f2a; padding:14px; border-radius:10px; overflow:auto; }
  </style>
</head>
<body>
  <h2>Fashion Oracle - Historique de Mode</h2>
  <p>Entrez une annee et cliquez Predict the Future.</p>
  <input id="year" type="number" value="2032" />
  <button onclick="run()">Predict the Future</button>
  <pre id="out"></pre>
  <script>
    async function run(){
      const y = document.getElementById('year').value;
      const r = await fetch(`/predict?year=${y}`);
      const j = await r.json();
      document.getElementById('out').textContent = JSON.stringify(j, null, 2);
    }
  </script>
</body>
</html>
